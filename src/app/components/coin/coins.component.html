<div class="mainpane">
  <div class="row">
    <div class="coinlist">
      @for (coin of coins; track coin; let i = $index) {
        <div class="pointer" (click)="selected=i; onSelect(i)"><span class="item" [class.selected]="i === selected">{{coin.symbol}}({{coin.name}})</span></div>
      }
    </div>
    <div class="coininfo">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
