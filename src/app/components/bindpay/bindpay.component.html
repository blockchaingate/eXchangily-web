<div class="row d-flex justify-content-center top-container">
  <div class="form">
    @if (!transactionHistory) {
      <div class="main-container">
        <label for="fname">{{'Coin' | translate }}</label>
        @if (mytokens) {
          <select id="coin" name="coin" class="coin" [(ngModel)]="tokenIndex" title="{{'Select a coin' | translate}}">
            <option class="coinitem" value="-1">
              {{'Kanban Gas' | translate}}({{gas}})
            </option>
            @for (id of mytokens.ids; track id; let i = $index) {
              <ng-container class="coin">
                <option class="coinitem" [value]="i">
                  {{mytokens.symbols[i]}}
                  ({{utilServ.toNumber(utilServ.showAmount(mytokens.balances[i], mytokens.decimals[i]))}})
                </option>
              </ng-container>
            }
          </select>
        }
        <label for="address">{{'Receive address' | translate}}<small>({{'Receive address in eXchangily' | translate}})</small></label>
        <input type="text" [(ngModel)]="receiverAddress" id="receiverAddress" name="receiverAddress" placeholder="{{'Receiver\'s address' | translate}}">
        <label for="amount">{{'Amount' | translate}}</label>
        <input type="text" [(ngModel)]="amount" id="amount" name="amount" placeholder="{{'Transfer amount' | translate}}">
      </div>
    }
    @if (transactionHistory) {
      <div class="w-100">
        <app-bindpay-transaction-history [transactionHistories]="transactionHistories"></app-bindpay-transaction-history>
      </div>
    }
    <div class="py-3 d-flex justify-content-between">
      <div>
        <button type="button" class="button px-3 mx-3" (click)="confirmTransfer()">{{'Send' | translate}}</button>
      </div>

      <div>
        <modal-receive-coin [address]="exAddress"></modal-receive-coin>
      </div>

      <div>
        <button type="button" class="button px-3 mx-3" (click)="showTransactionHisotry()">{{'Transaction History' | translate}}</button>
      </div>

    </div>

  </div>
</div>

<pin-number-modal #pinModal (confirmedPin)="onConfirmedPin($event)"></pin-number-modal>
