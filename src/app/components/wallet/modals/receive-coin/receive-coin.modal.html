<button class="button btn-fixed-width" type="button" (click)="openModal(templateReceive)">{{"Receive" | translate }}</button>

<ng-template #templateReceive class="modal-bg-grey">
  <div class="modal-header text-center">
    <h4 class="modal-title w-100">{{"Receive" | translate }}</h4>
    <button type="button" class="close pull-right" aria-label="Close" (click)="modalRef.hide()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <div class="text-dark">{{"Currency" | translate }}</div>
    <div class="pt-2 pb-3 w-25">
      <select class="form-control" (change)="onChange($event)" title="Select a currency">
        @for (coin of wallet.mycoins; track coin; let i = $index) {
          <option [value]="i">
            {{coin.symbol}}
            @if (coin.tokenType=='ETH') {
              <span>
                (ETH)
              </span>
            }
            @if (coin.tokenType=='TRX') {
              <span>
                (TRX)
              </span>
            }
            @if (coin.tokenType=='BNB') {
              <span>
                (BSC)
              </span>
            }
            @if (coin.tokenType=='MATIC') {
              <span>
                (MATIC)
              </span>
            }
            @if (coin.tokenType=='HT') {
              <span>
                (HT)
              </span>
            }
          </option>
        }
      </select>
    </div>

    <div class="text-dark">
      <div class="d-flex justify-content-between">
        <div>
          {{"Wallet address" | translate }}
        </div>
        @if (currentAddress.indexOf('bch') == 0) {
          <div>
            <button mat-button type="button" color="primary" (click)="changeToLegacyAddress()">
              {{'Legacy Address' | translate }}
            </button>
          </div>
        }
      </div>

    </div>
    <div>
      {{currentAddress}}
      <span class="hand" (click)="copyAddress()" title="copy address" aria-label="copy address" style="margin-left:4px; position:relative; top:10px; display:inline-block;">
        <mat-icon svgIcon="copy"></mat-icon>
      </span>
    </div>

    <div class="text-center py-5">
      <qrcode [qrdata]="currentAddress" id="address_qr_code" class="Qrcode" [width]="150" [errorCorrectionLevel]="'M'"></qrcode>
      <div class="py-2">
        <a href="{{link}}" download (click)="dlDataUrlBin()">
          <div class="d-inline-block px-1">
            <img src="/assets/download.png" alt="download">
          </div>
          <div class="d-inline-block px-1">
            {{'Download QR Code' | translate}}
          </div>
        </a>

      </div>
    </div>
  </div>
</ng-template>
