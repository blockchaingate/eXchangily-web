<div bsModal #pinModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="mySmallModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-sm pin-modal-dialog">
        <form class="pin-form" [formGroup]="pinForm" (ngSubmit)="onSubmit()">
            <div class="modal-content pin-modal-content">
                <div class="modal-header pin-modal-header text-center">
                    <h4 class="modal-title w-100 pin-modal-title">{{'Password' | translate }}</h4>
                    <button type="button" class="close pin-modal-close" aria-label="Close" (click)="hide()">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body pin-modal-body">
                    <p class="pin-modal-hint">{{'Pin Modal Hint' | translate }}</p>
                    <mat-form-field class="pin-field" appearance="outline" subscriptSizing="dynamic">
                        <mat-label>{{'Password' | translate }}</mat-label>
                        <input type="password" aria-label="Password" autocomplete="off" matInput [matAutocomplete]="auto" formControlName="pin" placeholder="••••••••">
                        <mat-autocomplete #auto="matAutocomplete"></mat-autocomplete>
                    </mat-form-field>
                    <div class="modal-footer pin-modal-footer justify-content-center">
                        <button class="btn pin-confirm-btn py-2 px-5 btn-lg-fixed-width" type="submit">{{'Confirm' | translate }}</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
